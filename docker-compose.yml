version: '3.8'

services:
  # MongoDB Database
  mongodb:
    image: mongo:7.0
    container_name: medical-waste-mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: password
      MONGO_INITDB_DATABASE: medical-waste
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
      - ./mongo-init.js:/docker-entrypoint-initdb.d/mongo-init.js:ro
    networks:
      - medical-waste-network

  # Backend API
  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: medical-waste-backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      MONGODB_URI: mongodb://admin:password@mongodb:27017/medical-waste?authSource=admin
      PORT: 5000
      AI_SERVICE_URL: http://ai-service:8000
      FRONTEND_URL: http://localhost:3000
    ports:
      - "5000:5000"
    depends_on:
      - mongodb
      - ai-service
    networks:
      - medical-waste-network
    volumes:
      - ./server:/app
      - /app/node_modules

  # AI Service
  ai-service:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    container_name: medical-waste-ai-service
    restart: unless-stopped
    environment:
      MODEL_PATH: models/yolov8n.pt
      MODEL_CONFIDENCE: 0.5
      MODEL_IOU_THRESHOLD: 0.45
      HOST: 0.0.0.0
      PORT: 8000
      DEBUG: "false"
    ports:
      - "8000:8000"
    networks:
      - medical-waste-network
    volumes:
      - ./ai-service:/app
      - ai_service_models:/app/models
      - ai_service_logs:/app/logs
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  # Frontend
  frontend:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: medical-waste-frontend
    restart: unless-stopped
    environment:
      VITE_API_URL: http://localhost:5000/api
      VITE_AI_SERVICE_URL: http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      - backend
    networks:
      - medical-waste-network
    volumes:
      - ./client:/app
      - /app/node_modules

  # Nginx Reverse Proxy (Optional)
  nginx:
    image: nginx:alpine
    container_name: medical-waste-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      - frontend
      - backend
      - ai-service
    networks:
      - medical-waste-network

volumes:
  mongodb_data:
    driver: local
  ai_service_models:
    driver: local
  ai_service_logs:
    driver: local

networks:
  medical-waste-network:
    driver: bridge
